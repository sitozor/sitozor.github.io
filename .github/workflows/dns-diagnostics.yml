name: DNS diagnostics
on: workflow_dispatch
permissions: {}
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - name: Query the zone from GitHub's network
        run: |
          for srv in ns1.reg.ru ns2.reg.ru 8.8.8.8 1.1.1.1; do
            echo "=== @$srv"
            dig +time=5 +tries=2 @$srv TXT _github-pages-challenge-sitozor.sitozor.ru | grep -E "status:|IN\s+TXT|Query time|timed out|no servers" || true
            dig +time=5 +tries=2 @$srv CAA sitozor.ru | grep -E "status:|Query time|timed out|no servers" || true
          done
          echo "=== nameserver addresses"
          dig +short ns1.reg.ru A; dig +short ns2.reg.ru A
          echo "=== trace"
          dig +trace +time=5 +tries=1 sitozor.ru A 2>&1 | tail -15 || true
